<svg viewBox="0 0 1500 280" xmlns="http://www.w3.org/2000/svg" width="1500" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="50%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="280" fill="url(#bg)"/>
  <ellipse cx="750" cy="140" rx="600" ry="200" fill="url(#glow)"/>
  <circle cx="200" cy="80" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="350" cy="200" r="1.5" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="1200" cy="100" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="1300" cy="220" r="1.5" fill="#c4b5fd" opacity="0.4"/>
  <text x="750" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#textGrad)" filter="url(#textShadow)">Rohan Sharma</text>
  <text x="750" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#c4b5fd" opacity="0.9">AI/ML Engineer · Full Stack Developer</text>
</svg>
